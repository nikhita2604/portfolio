<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Friend Forever ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
overflow:hidden;
background:linear-gradient(135deg,#ff9ecf,#ffd6ea,#fff0f7);
height:100vh;
}

.page{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
}

.card{
background:white;
padding:40px;
border-radius:30px;
text-align:center;
width:90%;
max-width:800px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
animation:pop 0.8s ease;
z-index:5;
}

@keyframes pop{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

h1{
color:#ff3f8e;
margin-bottom:20px;
}

.subtitle{
font-size:18px;
color:#666;
margin-bottom:30px;
}

button{
padding:14px 30px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

#yesBtn{
background:#ff3f8e;
color:white;
margin-right:15px;
}

#yesBtn:hover{
transform:scale(1.08);
}

#noBtn{
background:#666;
color:white;
position:absolute;
}

.warning{
margin-top:25px;
font-weight:bold;
color:#ff3f8e;
min-height:30px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.contract{
text-align:left;
line-height:2;
font-size:18px;
}

.signature-box{
margin-top:20px;
text-align:center;
}

#signaturePad{
border:2px solid #ccc;
border-radius:12px;
background:white;
touch-action:none;
}

.certificate{
background:white;
border:12px solid gold;
border-radius:25px;
padding:40px;
max-width:900px;
width:100%;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,.2);
position:relative;
}

.gold-seal{
position:absolute;
top:20px;
right:20px;
width:120px;
height:120px;
background:gold;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:14px;
text-align:center;
color:#7a5200;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

.polaroid{
width:220px;
background:white;
padding:10px 10px 35px;
margin:20px auto;
box-shadow:0 5px 20px rgba(0,0,0,.2);
transform:rotate(-4deg);
}

.polaroid img{
width:100%;
height:250px;
object-fit:cover;
}

.polaroid p{
margin-top:10px;
font-weight:bold;
color:#ff3f8e;
}

.cert-buttons{
margin-top:25px;
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

.download-btn{
background:#28a745;
color:white;
}

.print-btn{
background:#007bff;
color:white;
}

.heart{
position:absolute;
font-size:24px;
animation:float 8s linear infinite;
opacity:.7;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

#confettiCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:999;
}

</style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>

<div id="heartsContainer"></div>

<div class="page" id="mainPage">

<div class="card">

<h1 id="typewriter"></h1>

<p class="subtitle">
A once in a lifetime friendship proposal 💖
</p>

<button id="yesBtn">
YES 💕
</button>

<button id="noBtn">
NO 😅
</button>

<div class="warning" id="warning"></div>

</div>

</div>
<script>

// TYPEWRITER EFFECT

const titleText = "💖 Will You Be My Best Friend For Life? 💖";
let index = 0;

function typeWriter(){
    if(index < titleText.length){
        document.getElementById("typewriter").innerHTML += titleText.charAt(index);
        index++;
        setTimeout(typeWriter, 70);
    }
}

typeWriter();


// FLOATING HEARTS

function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration =
    (Math.random() * 4 + 5) + "s";

    document.getElementById("heartsContainer")
    .appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);

}

setInterval(createHeart,500);


// ESCAPING NO BUTTON

const noBtn = document.getElementById("noBtn");
const warning = document.getElementById("warning");

const warnings = [
"🤔 Think again...",
"🎁 You will lose the jackpot!",
"😂 Nice try!",
"🚨 Friendship opportunity detected!",
"💖 Are you really sure?",
"😢 Regret may occur later!"
];

noBtn.addEventListener("mouseover",()=>{

    const x = Math.random() *
    (window.innerWidth - 150);

    const y = Math.random() *
    (window.innerHeight - 100);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    warning.innerHTML =
    warnings[Math.floor(Math.random()*warnings.length)];

});


// YES BUTTON

document.getElementById("yesBtn")
.addEventListener("click",()=>{

document.getElementById("mainPage").innerHTML = `

<div class="card">

<h1>📜 Friendship Contract</h1>

<div class="contract">

<ol>

<li>📸 Must send 2 selfies per day.</li>

<li>😄 At least think twice before saying No.</li>

<li>🫶 Share your thoughts whenever you feel comfortable.</li>

<li>😂 Laugh at my terrible jokes.</li>

<li>🍕 Sharing secrets is mandatory.</li>

<li>📱 Random photos are always welcome.</li>


<li>🤝 Be from myside on good and bad days.</li>

<li>📷 Share memes whenever possible.</li>

<li>💖 Keep this friendship special forever.</li>

</ol>

</div>

<br>

<h3>📸 Upload Your Bestie Photo</h3>

<input type="file"
id="photoInput"
accept="image/*">

<br><br>

<h3>✍ Draw Your Signature</h3>

<div class="signature-box">

<canvas
id="signaturePad"
width="700"
height="200">
</canvas>

</div>

<br>

<input
type="text"
id="friendName"
placeholder="Enter your name">

<br><br>

<button id="acceptBtn">
Accept Contract ❤️
</button>

</div>
`;

setupSignaturePad();

document
.getElementById("acceptBtn")
.addEventListener("click",generateCertificate);

});


// SIGNATURE PAD

function setupSignaturePad(){

const canvas =
document.getElementById("signaturePad");

const ctx =
canvas.getContext("2d");

let drawing = false;

function start(e){

drawing = true;

draw(e);

}

function stop(){

drawing = false;

ctx.beginPath();

}

function draw(e){

if(!drawing) return;

const rect =
canvas.getBoundingClientRect();

let x,y;

if(e.touches){

x =
e.touches[0].clientX - rect.left;

y =
e.touches[0].clientY - rect.top;

}else{

x =
e.clientX - rect.left;

y =
e.clientY - rect.top;

}

ctx.lineWidth = 3;
ctx.lineCap = "round";
ctx.strokeStyle = "#000";

ctx.lineTo(x,y);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x,y);

}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mouseup",stop);
canvas.addEventListener("mousemove",draw);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchend",stop);
canvas.addEventListener("touchmove",draw);

}

</script>
<script>

// GENERATE CERTIFICATE

function generateCertificate(){

const name =
document.getElementById("friendName").value.trim();

document.getElementById("photoInput");

let imageURL = "";

if(fileInput.files.length > 0){

imageURL =

}

document.getElementById("mainPage").innerHTML = `

<div class="certificate" id="certificate">

<div class="gold-seal">
BESTIE<br>
FOREVER<br>
⭐
</div>

<h1>
🏆 CERTIFICATE OF BEST FRIENDSHIP 🏆
</h1>

<p style="font-size:22px;margin-top:20px;">
This certificate proudly confirms that
</p>

<h2 style="
font-size:45px;
color:#ff3f8e;
margin:20px 0;
">
${name}
</h2>

<p style="font-size:22px;">
has officially accepted the title of

${

<p style="

</p>

<br><br>

<div style="
display:flex;
justify-content:space-between;
margin-top:40px;
flex-wrap:wrap;
gap:20px;
">

<div>
____________________
<br>
Friend's Signature
</div>

<div>
____________________
<br>
NIKHITA SHETTY ❤️
</div>

</div>

<div class="cert-buttons">

<button
class="download-btn"
onclick="downloadCertificate()">
📥 Download PNG
</button>

<button
class="print-btn"
onclick="window.print()">
🖨 Print
</button>

</div>

</div>

`;

startConfetti();

}


// CONFETTI

function startConfetti(){

const canvas =
document.getElementById("confettiCanvas");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const confetti = [];

for(let i=0;i<200;i++){

confetti.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

size:Math.random()*8+2,

speed:Math.random()*3+2,

rotation:Math.random()*360

});

}

function animate(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

confetti.forEach(c=>{

ctx.save();

ctx.translate(c.x,c.y);

ctx.rotate(c.rotation);

ctx.fillStyle =
[
"#ff3f8e",
"#ffd700",
"#ff69b4",
"#ff1493"
][Math.floor(Math.random()*4)];

ctx.fillRect(
0,
0,
c.size,
c.size
);

ctx.restore();

c.y += c.speed;

if(c.y > canvas.height){

c.y = -10;

}

});

requestAnimationFrame(animate);

}

animate();

}


// DOWNLOAD PNG

function downloadCertificate(){

const certificate =
document.getElementById("certificate");

html2canvas(certificate).then(canvas=>{

const link =
document.createElement("a");

link.download =
"BestFriendCertificate.png";

link.href =
canvas.toDataURL("image/png");

link.click();

});

}

</script>

<!-- html2canvas required for PNG download -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
